services:
  postgres:
    # pgvector/pgvector:pg17 is plain postgres:17 with the pgvector extension
    # precompiled in: doubles as the dlt staging store and the vector store
    # (see indexing/pgvector_index.py), so a managed instance (Neon) covers
    # both without a separate vector database account.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santapola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-santapola}
      POSTGRES_DB: ${POSTGRES_DB:-santapola}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-santapola}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    # BM25 text search (see indexing/opensearch_index.py). Chosen over
    # Elasticsearch specifically because Elastic Cloud has no free tier that
    # doesn't expire; OpenSearch's own k-NN plugin was also benchmarked for
    # the vector side but lost to pgvector (retrieval_eval.py), so this index
    # only carries text.
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-santapola}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-santapola123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
      # Not bundled with core Grafana: OpenSearch diverged enough from
      # Elastic's own datasource plugin that Grafana Labs ships a dedicated
      # one instead.
      GF_INSTALL_PLUGINS: "grafana-opensearch-datasource"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - opensearch
      - tempo

  ingest:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    entrypoint:
      - sh
      - -c
      - "uv run python -m santa_pola_rag.ingestion.pipeline && uv run python -m santa_pola_rag.indexing.build_index"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    ports:
      - "8501:8501"
    depends_on:
      ingest:
        condition: service_completed_successfully
      tempo:
        condition: service_started

volumes:
  postgres_data:
  opensearch_data:
  minio_data:
  tempo_data:
  grafana_data:
