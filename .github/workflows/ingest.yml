name: Ingest

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to run
        type: choice
        options:
          - build_index
          - pipeline_and_build_index
        default: build_index
      pipeline_args:
        description: Extra args for the ingestion pipeline (e.g. --force --categories bandos)
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSLMODE: require
      MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      OPENSEARCH_API_KEY: ${{ secrets.OPENSEARCH_API_KEY }}
      OPENSEARCH_USER: ${{ secrets.OPENSEARCH_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.13

      - run: uv sync --frozen --extra ingestion

      - name: Run ingestion pipeline
        if: inputs.target == 'pipeline_and_build_index'
        run: uv run python -m santa_pola_rag.ingestion.pipeline ${{ inputs.pipeline_args }}

      - name: Build index (embed + index into pgvector/OpenSearch)
        run: uv run python -m santa_pola_rag.indexing.build_index
