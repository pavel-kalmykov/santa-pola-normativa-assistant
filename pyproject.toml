[project]
name = "santa-pola-normativa-assistant"
version = "0.1.0"
description = "Multilingual conversational RAG assistant over Santa Pola's public municipal ordinances (LLM Zoomcamp 2026 capstone)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.62",
    "dlt[postgres]>=1.29.1",
    "elasticsearch>=9.4.1",
    "langchain-text-splitters>=1.1.2",
    "lingua-language-detector>=2.2.0",
    "openai>=2.52.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-ai>=2.22.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/santa_pola_rag"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
