about_body = """
**Ce que c'est** : un assistant conversationnel qui répond aux questions sur la réglementation municipale de Santa Pola (ordonnances, ordonnances fiscales, règlements et avis publics), dans n'importe quelle langue, en citant toujours le document et la page source.

**Comment ça marche** : il indexe les documents PDF officiels publiés par la mairie et combine recherche sémantique et recherche par mots-clés pour trouver les passages pertinents ; un modèle de langage rédige la réponse à partir de ceux-ci, sans inventer d'information absente des documents.

**Stack technique** : ingestion avec dlt, PDF stockés dans MinIO, recherche hybride avec Qdrant et Elasticsearch, agent Pydantic AI sur DeepSeek, interface Streamlit, observabilité avec OpenTelemetry, Tempo et Grafana.

**Avertissement** : les réponses sont générées automatiquement à partir des documents indexés et peuvent ne pas refléter la réglementation la plus récente ; pour toute démarche officielle, vérifiez toujours auprès de la mairie de Santa Pola.
"""
