about_title = ":material/info: Über diesen Assistenten"
about_body = """
**Was es ist**: ein Gesprächsassistent, der Fragen zu den städtischen Vorschriften von Santa Pola (Verordnungen, Steuerordnungen, Satzungen und amtlichen Bekanntmachungen) in jeder Sprache beantwortet und dabei stets das Quelldokument und die Seite angibt.

**Wie es funktioniert**: er indiziert die offiziellen PDF-Dokumente des Rathauses und kombiniert semantische Suche mit Stichwortsuche, um die relevanten Passagen zu finden; ein Sprachmodell verfasst daraus die Antwort, ohne Informationen zu erfinden, die nicht in den Dokumenten stehen.

**Technischer Stack**: Ingestion mit dlt, PDFs in MinIO, hybride Suche mit pgvector und OpenSearch, ein Pydantic-AI-Agent auf Basis von GLM (Z.ai), eine Streamlit-Oberfläche, Observability mit OpenTelemetry, Tempo und Grafana.

**Hinweis**: Antworten werden automatisch aus den indizierten Dokumenten generiert und spiegeln möglicherweise nicht die aktuellsten Vorschriften wider; für amtliche Vorgänge stets beim Rathaus von Santa Pola nachfragen.
"""
