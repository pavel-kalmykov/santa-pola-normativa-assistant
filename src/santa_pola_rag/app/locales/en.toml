about_title = ":material/info: About this assistant"
about_body = """
**What it is**: a conversational assistant that answers questions about Santa Pola's municipal regulations (ordinances, tax ordinances, bylaws and public notices), in any language, always citing the source document and page.

**How it works**: it indexes the official PDF documents published by the town hall and combines semantic and keyword search to find the relevant passages; a language model drafts the answer from them, without inventing information that isn't in the documents.

**Tech stack**: ingestion with dlt, PDFs stored in MinIO, hybrid search with pgvector and OpenSearch, a Pydantic AI agent on top of GLM (Z.ai), a Streamlit interface, observability with OpenTelemetry, Tempo and Grafana.

**Disclaimer**: answers are generated automatically from the indexed documents and may not reflect the most recent regulations; for official procedures, always confirm with the Santa Pola town hall.
"""
