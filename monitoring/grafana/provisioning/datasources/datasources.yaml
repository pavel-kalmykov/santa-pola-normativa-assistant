apiVersion: 1

# Grafana's file-based provisioning only adds/updates entries listed below;
# it doesn't prune ones removed from this file, so the old Postgres
# datasource (dropped once query/feedback logs moved to Elasticsearch)
# stayed around as an orphaned, unused entry until deleted explicitly here.
deleteDatasources:
  - name: Postgres
    orgId: 1

datasources:
  - name: Tempo
    uid: tempo_main
    type: tempo
    access: proxy
    url: http://tempo:3200

  - name: Elasticsearch-Queries
    uid: es_queries
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: santa_pola_queries
    jsonData:
      timeField: created_at
      esVersion: "8.0.0"
    isDefault: true

  - name: Elasticsearch-Feedback
    uid: es_feedback
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: santa_pola_feedback
    jsonData:
      timeField: created_at
      esVersion: "8.0.0"
